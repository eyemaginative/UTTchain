[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false

ffi = false

bytecode_hash = "ipfs"
use_literal_content = true

auto_detect_remappings = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/","forge-std/=lib/forge-std/src/"]
